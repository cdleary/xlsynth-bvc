syntax = "proto3";

package xlsynth.bvc.v1;

import "xlsynth/bvc/v1/common.proto";

message IrDirCorpusPriorityTier {
  string tier_name = 1;
  int32 queue_priority_boost = 2;
  repeated Sha256Digest structural_hashes = 3;
  string reason = 4;
}

message IrDirCorpusSchedulingPolicy {
  uint32 schema_version = 1;
  string policy_name = 2;
  uint32 semantic_version = 3;
  uint64 expected_corpus_sample_count = 4;
  Sha256Digest expected_corpus_artifact_manifest_sha256 = 5;
  repeated IrDirCorpusPriorityTier priority_tiers = 6;
}

message IrDirCorpusSchedulingPolicyMarker {
  uint32 marker_schema_version = 1;
  uint32 policy_schema_version = 2;
  string policy_name = 3;
  uint32 policy_semantic_version = 4;
  Sha256Digest policy_config_sha256 = 5;
}
