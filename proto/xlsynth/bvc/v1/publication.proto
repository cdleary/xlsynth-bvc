syntax = "proto3";

package xlsynth.bvc.v1;

import "google/protobuf/timestamp.proto";
import "xlsynth/bvc/v1/action.proto";
import "xlsynth/bvc/v1/campaign.proto";
import "xlsynth/bvc/v1/common.proto";

message PublicationFile {
  string logical_key = 1;
  NormalizedRelpath relpath = 2;
  uint64 bytes = 3;
  Sha256Digest sha256 = 4;
  string media_type = 5;
}

// Fields whose canonical wire encoding determines snapshot_id. Entries must be
// sorted by logical_key and relpath before encoding.
message PublicationSnapshotIdentity {
  uint32 identity_version = 1;
  uint32 publication_policy_version = 2;
  optional Sha256Digest source_action_set_sha256 = 3;
  Sha256Digest schema_descriptor_sha256 = 4;
  repeated PublicationFile dataset_files = 5;
}

message PublicationSnapshotManifest {
  uint32 record_version = 1;
  Sha256Digest snapshot_id = 2;
  google.protobuf.Timestamp generated_at = 3;
  optional string producing_git_commit = 4;
  optional Sha256Digest source_action_set_sha256 = 5;
  Sha256Digest schema_descriptor_sha256 = 6;
  uint32 publication_policy_version = 7;
  repeated PublicationFile dataset_files = 8;
  uint64 total_dataset_bytes = 9;
  repeated Sha256Digest campaign_ids = 10;
  repeated Sha256Digest run_ids = 11;
}

message StaticSiteManifest {
  uint32 record_version = 1;
  Sha256Digest source_snapshot_id = 2;
  string base_url = 3;
  repeated PublicationFile files = 4;
}

// Immutable source evidence for release metadata overlaid while building a
// static site from an older publication snapshot. The browser catalog is the
// final JSON projection; verification reconstructs it from this protobuf and
// the snapshot-backed processing rows.
message StaticSiteReleaseMetadataEvidence {
  uint32 record_version = 1;
  Sha256Digest version_compat_sha256 = 2;
  repeated StaticSiteCrateReleaseMetadata releases = 3;
  optional StaticSiteRepositoryHeadObservation repository_head_observation = 4;
  bytes version_compat_json = 5;
}

message StaticSiteCrateReleaseMetadata {
  CrateVersion crate_version = 1;
  DsoVersion dso_version = 2;
  string crate_release_datetime = 3;
  google.protobuf.Timestamp crate_released_at = 4;
}

message StaticSiteRepositoryHeadObservation {
  uint32 schema_version = 1;
  string repository = 2;
  Sha256Digest version_compat_sha256 = 3;
  google.protobuf.Timestamp observed_at = 4;
  string head_ref = 5;
  string head_commit = 6;
  google.protobuf.Timestamp head_committed_at = 7;
  CrateVersion latest_crate_version = 8;
  string latest_release_tag = 9;
  string latest_release_commit = 10;
  google.protobuf.Timestamp latest_release_committed_at = 11;
  string comparison_status = 12;
  uint64 commits_ahead = 13;
  uint64 commits_behind = 14;
  string observed_at_utc = 15;
  string head_committed_at_utc = 16;
  string latest_release_committed_at_utc = 17;
}

// Immutable public evidence for one evaluated generation in a fixed-corpus
// progression cohort. Operational corpus JSON is admitted only at the run
// workspace boundary; publication, verification, and archival use this typed
// protobuf until the final browser JSON projection is produced.
message FixedCorpusProgressionRunEvidence {
  uint32 record_version = 1;
  string cohort_id = 2;
  Sha256Digest cohort_artifact_manifest_sha256 = 3;
  Sha256Digest generation_id = 4;
  oneof origin {
    FixedCorpusCrateReleaseOrigin crate_release = 5;
    FixedCorpusGitRevisionOrigin git_revision = 6;
  }
  google.protobuf.Timestamp event_time = 7;
  DsoVersion dso_version = 8;
  optional Sha256Digest baseline_generation_id = 9;
  uint64 cohort_sample_count = 10;
  repeated FixedCorpusProgressionSampleEvidence samples = 11;
}

message FixedCorpusCrateReleaseOrigin {
  CrateVersion crate_version = 1;
}

message FixedCorpusGitRevisionOrigin {
  DriverSourceRevision revision = 1;
  optional string requested_ref = 2;
  CrateVersion baseline_crate_version = 3;
  optional string baseline_release_commit = 4;
  // Exact fields from the v4 candidate-run identity. The optional commit
  // above remains the independently observed browser projection.
  string identity_baseline_release_tag = 5;
  string identity_baseline_commit = 6;
}

message FixedCorpusProgressionSampleEvidence {
  string fn_key = 1;
  Sha256Digest structural_hash = 2;
  Sha256Digest source_sha256 = 3;
  uint64 ir_node_count = 4;
  double g8r_nodes = 5;
  double g8r_levels = 6;
  double yosys_abc_nodes = 7;
  double yosys_abc_levels = 8;
  double g8r_product = 9;
  double yosys_abc_product = 10;
  double g8r_product_loss = 11;
  ActionId ir_action_id = 12;
  ActionId g8r_stats_action_id = 13;
  ActionId yosys_abc_stats_action_id = 14;
  uint64 g8r_stats_output_bytes = 15;
  Sha256Digest g8r_stats_output_sha256 = 16;
  Sha256Digest g8r_metric_projection_sha256 = 17;
  optional uint64 yosys_abc_stats_output_bytes = 18;
  optional Sha256Digest yosys_abc_stats_output_sha256 = 19;
  optional Sha256Digest yosys_abc_metric_projection_sha256 = 20;
  FixedCorpusProgressionSampleActionGraph action_graph = 21;
}

// Typed action graph for the stages computed by this generation. A matched
// release owns both branches. A direct Git G8r+ABC evaluation owns only its
// G8r branch; its codegen/Yosys reference metrics and action ID are bound to
// baseline_generation_id and checked against that release generation during
// site verification.
message FixedCorpusProgressionSampleActionGraph {
  ActionSpec import_ir = 1;
  ActionSpec g8r_aig = 2;
  ActionSpec g8r_abc_aig = 3;
  ActionSpec g8r_stats = 4;
  optional ActionSpec combo_verilog = 5;
  optional ActionSpec yosys_abc_aig = 6;
  optional ActionSpec yosys_abc_stats = 7;
}

// Public projection of a campaign run. Operational runtimes, local paths,
// commands, queue leases, and raw error text are deliberately absent.
message PublicCampaignRun {
  uint32 record_version = 1;
  Sha256Digest campaign_id = 2;
  Sha256Digest run_id = 3;
  string campaign_name = 4;
  uint32 campaign_semantic_version = 5;
  CrateVersion crate_version = 6;
  DsoVersion dso_version = 7;
  CampaignRunStatus status = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated ActionId root_action_ids = 10;
  uint64 completed_root_count = 11;
  uint64 pending_count = 12;
  uint64 running_count = 13;
  uint64 failed_count = 14;
  uint64 canceled_count = 15;
  uint64 missing_output_count = 16;
  uint64 failed_sample_count = 17;
  repeated IntentionallySkippedSample intentionally_skipped_samples = 18;
}
