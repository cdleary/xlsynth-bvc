syntax = "proto3";
package xlsynth.bvc.ir_archive.v1;

// Portable IR roots, not evidence that any synthesis action has completed.
// Compiled separately from the evaluation-store descriptor.
message IrArchiveIndex {
  uint32 record_version = 1;
  // Exactly 256 entries, ordered 00 through ff, including empty buckets.
  repeated IrArchiveBucket buckets = 2;
  // Unique and sorted by (corpus, source_relpath).
  repeated IrArchiveRoot roots = 3;
}

message IrArchiveBucket {
  string prefix = 1;
  uint64 archive_bytes = 2;
  bytes archive_sha256 = 3;
  // Unique and sorted by the SHA-256 of exact IR bytes, not structural hash.
  repeated IrArchiveBlob blobs = 4;
}

message IrArchiveBlob {
  bytes sha256 = 1;
  uint64 bytes = 2;
}

message IrArchiveRoot {
  string corpus = 1;
  string source_relpath = 2;
  bytes source_sha256 = 3;
  string top_fn_name = 4;
}
